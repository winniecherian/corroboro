# Rebuilds Corroboro with fresh news and deploys it to Firebase Hosting.
#
# Why it is built this way: GitHub's own schedule (cron) is best-effort and often skips runs for hours.
# So each run, once it has deployed, waits and then starts the next one itself (about every 5 minutes).
# The cron below is only a watchdog: if the chain ever breaks, it restarts it within 15 minutes.
# Also runs on every push to main and on demand (Actions tab -> Run workflow).
# Keep the repository PUBLIC: GitHub Actions minutes are unlimited for public repos.

name: Refresh and deploy

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Skip until Firebase is set up
        if: env.HAS_FIREBASE != 'true'
        run: echo "::notice::Add the FIREBASE_SERVICE_ACCOUNT secret to start deploying."

      - uses: actions/checkout@v4
        if: env.HAS_FIREBASE == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_FIREBASE == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: env.HAS_FIREBASE == 'true'

      - name: Build static site with fresh feeds
        if: env.HAS_FIREBASE == 'true'
        run: npm run export
        env:
          STRICT_FEEDS: "1" # fail instead of publishing sample stories if feeds can't be reached
          NEXT_TELEMETRY_DISABLED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

      - name: Deploy to Firebase Hosting
        if: env.HAS_FIREBASE == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: corroboro-cb2d1
          channelId: live

  # Starts the next run about 5 minutes after this one began, unless another run is already active.
  next:
    needs: deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Wait, then start the next refresh
        run: |
          active() {
            for st in in_progress queued; do
              gh api "repos/$REPO/actions/workflows/refresh.yml/runs?status=$st&per_page=50" \
                --jq "[.workflow_runs[] | select(.id != $RUN_ID)] | length"
            done | paste -sd+ - | bc
          }
          if [ "$(active)" -gt 0 ]; then echo "Another run is active; it will keep the chain going."; exit 0; fi
          sleep 200
          if [ "$(active)" -gt 0 ]; then echo "Another run started meanwhile."; exit 0; fi
          gh workflow run refresh.yml --repo "$REPO" --ref main
