# Rebuilds Corroboro with fresh news and deploys it to Firebase Hosting.
# Runs every 10 minutes, on every push to main, and on demand (Actions tab → Run workflow).
# Keep the repository PUBLIC: GitHub Actions minutes are unlimited for public repos.
# A private repo gets 2,000 free minutes a month, which a 10-minute schedule would use up.

name: Refresh and deploy

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Skip until Firebase is set up
        if: env.HAS_FIREBASE != 'true'
        run: echo "::notice::Add the FIREBASE_SERVICE_ACCOUNT secret to start deploying."

      - uses: actions/checkout@v4
        if: env.HAS_FIREBASE == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_FIREBASE == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: env.HAS_FIREBASE == 'true'

      - name: Build static site with fresh feeds
        if: env.HAS_FIREBASE == 'true'
        run: npm run export
        env:
          STRICT_FEEDS: "1" # fail instead of publishing sample stories if feeds can't be reached
          NEXT_TELEMETRY_DISABLED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

      - name: Deploy to Firebase Hosting
        if: env.HAS_FIREBASE == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: corroboro-cb2d1
          channelId: live
